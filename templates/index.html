<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Cloud Kitchen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Hostel Cloud Kitchen</h1>
        <div class="menu">
            {% for item, price in menu.items() %}
            <div class="card">
                <h3>{{ item }}</h3>
                <p>₹{{ price }}</p>
                <a href="{{ url_for('add_to_cart', item=item) }}" class="btn">Add to Cart</a>
            </div>
            {% endfor %}
        </div>
        <a href="{{ url_for('view_cart') }}" class="cart-btn">🛒 View Cart</a>
    </div>
</body>
</html>
